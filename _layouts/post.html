---
layout: default
---

<article>
  <header class="post-header">
    <h1>{% include post-title.html title=page.title text=content %}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time>
      {% if page.author %}<span>von {{ page.author }}</span>{% endif %}
      {% for category in page.categories %}<span class="tag">{{ category }}</span>{% endfor %}
    </p>
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
