<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/assets/css/custom.css">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="container site-header-inner">
      <a href="/" class="site-title" aria-current="{% if page.url == '/' %}page{% else %}false{% endif %}">ITNotes</a>
      <nav class="site-nav" aria-label="Hauptnavigation">
        <a href="/about" aria-current="{% if page.url == '/about/' %}page{% else %}false{% endif %}">About</a>
        <a href="/book-shelf" aria-current="{% if page.url == '/book-shelf/' %}page{% else %}false{% endif %}">Book-Shelf</a>
        <a href="/datenschutz" aria-current="{% if page.url == '/datenschutz/' %}page{% else %}false{% endif %}">Datenschutz</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Everything is an experiment. I believe that people can only achieve the extraordinary together.</p>
      <p><a href="/datenschutz">Datenschutz</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
    </div>
  </footer>
</body>
</html>
