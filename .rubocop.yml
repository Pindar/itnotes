plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  SuggestExtensions: false
  Exclude:
    - _site/**/*
    - node_modules/**/*
    - vendor/**/*

Style/StringLiterals:
  EnforcedStyle: single_quotes
Style/Documentation:
  Enabled: false
Metrics/BlockLength:
  Exclude:
    - spec/**/*
